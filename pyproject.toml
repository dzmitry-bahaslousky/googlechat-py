[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "googlechat-py"
version = "0.0.2"
description = "Unofficial async Python client and MCP server for Google Chat's internal web API (cookie-based auth, no Google Cloud project required)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dzmitry Bahaslouski" }]
keywords = ["mcp", "google-chat", "model-context-protocol"]
dependencies = [
    "mcp>=1.2.0,<2",
    # googlechat_pb2.py was generated by protoc for protobuf 6.31.1 and checks
    # the runtime version on import.
    "protobuf>=6.31.1",
    "httpx>=0.27",
    "click>=8.1",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/dzmitry-bahaslousky/googlechat-py"
Repository = "https://github.com/dzmitry-bahaslousky/googlechat-py"

[project.scripts]
googlechat-mcp = "googlechat.mcp_server:cli"
gchat = "googlechat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"googlechat._proto" = ["*.proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
